# =============================================================================
#  esp32-voip — ESP32-A1S (ES8388) SIP intercom via the custom `sip_voip` component.
#  Wraps Espressif's esp_rtc engine inside ESPHome for continuous full-duplex G.711.
#  Requires the ESPHome beta/2026.11+ add-on (esp-idf framework). First flash over USB.
# =============================================================================

substitutions:
  name: esp32-voip
  friendly_name: "ESP32 VoIP"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev            # ESP32-A1S = classic ESP32-WROVER
  framework:
    type: esp-idf            # REQUIRED — esp_rtc / ESP-ADF is esp-idf only
    # The prebuilt esp_rtc engine floods IDF INFO logs (per-packet SIP dumps) during
    # registration. ESPHome forwards them to the UART from the main loop task; at
    # 115200 baud that starves loopTask and the task watchdog resets the device
    # (~15 s -> boot loop -> safe mode). With CONFIG_LOG_DYNAMIC_LEVEL_CONTROL=n (an
    # ESPHome build default) esp_log_level_set() is a no-op, so the ONLY working gate
    # is the compile-time CONFIG_LOG_DEFAULT_LEVEL constant. Pin it to WARN: user
    # sdkconfig_options override the managed component's Kconfig default, so the
    # INFO flood is never generated (WARN/ERROR survive, incl. "sip or domain is NULL").
    log_level: WARN
    sdkconfig_options:
      CONFIG_LOG_DEFAULT_LEVEL_WARN: "y"
      CONFIG_LOG_MAXIMUM_LEVEL_WARN: "y"

# WROVER PSRAM — the SIP/RTC engine wants it.
psram:
  mode: quad
  speed: 40MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none      # modem-sleep drops SIP registration/RTP
  ap:
    ssid: ${friendly_name}
    password: !secret wifi_password

captive_portal:
api:
ota:
  - platform: esphome
    password: !secret ota_password
logger:
  level: DEBUG               # ESPHome's own verbosity (independent of the esp-idf
                             # native level, which is pinned to WARN in esp32: framework:).
  # CONFIG_LOG_DEFAULT_LEVEL=WARN silences all IN-TREE esp-idf INFO logs, but the
  # prebuilt esp_rtc .a was compiled elsewhere and its SIP/ESP_RTC_CORE INFO logs
  # bypass our log-level gate entirely (verified: in-tree tags are WARN-gated, only
  # the prebuilt lib leaks INFO). Nothing in our build can gate that library. During
  # SIP registration it emits thousands of lines/sec; forwarding them to the 115200
  # UART from the main loop starved loopTask -> task watchdog -> boot loop. Disable
  # the UART logger so the main loop never blocks on it. Logs remain available over
  # the network: ESPHome dashboard "Logs", or `esphome logs example.yaml`.
  baud_rate: 0

# ---- The custom SIP component (this repo) ----
external_components:
  - source: github://ogizhelev/esp32-voip@main
    components: [sip_voip]
    refresh: 0s              # always re-fetch @main while iterating

sip_voip:
  id: voip
  server: 10.10.4.5          # HA VoIP Stack SIP server (LAN IP)
  port: 5080                 # VoIP Stack's SIP port. Moved off 5060 because HA core's
                             # built-in "Voice over IP" integration squats UDP 5060;
                             # set VoIP Stack to the SAME port here.
  username: !secret sip_username     # SIP account to register as. NOTE: esp_rtc has no
                                     # separate auth-username field — this IS the digest
                                     # auth user, so it must match the PBX account's auth user.
  password: !secret sip_password     # its password (MD5 digest only; SHA-256 unsupported)
  # domain: 10.10.4.5        # optional SIP domain/realm for From/To/Contact URIs.
                             # Empty = use `server`. Set only if the PBX expects a named realm.
  # codec: pcma              # pcma (G.711 a-law, default) | pcmu (u-law)
  auto_answer: true          # door behaviour: pick up incoming calls automatically

# ---- Diagnostics ----
sensor:
  - platform: uptime
    name: "Uptime"
  - platform: wifi_signal
    name: "WiFi"
    update_interval: 60s
text_sensor:
  - platform: version
    name: "ESPHome Version"
